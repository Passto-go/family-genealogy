<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12303B" />
    <meta
      name="description"
      content="家族族谱 — 世系昭穆，一脉相承。查阅家族源流、世系图谱与家风家训。"
    />
    <title>时光家谱</title>
    <script>
      // 首屏同步应用主题，消除 React 挂载前后的浅/深闪烁。
      // 昼夜判定与 ThemeModeProvider 保持一致：本地时间 06:00–18:59 为日间（浅色），其余为夜间。
      (function () {
        try {
          var hour = new Date().getHours();
          var dark = hour < 6 || hour >= 19;
          var el = document.documentElement;
          el.classList.toggle("dark", dark);
          el.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
