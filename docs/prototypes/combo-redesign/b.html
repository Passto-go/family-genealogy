<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案 B · 右图左传 · 沈氏谱</title>
<link rel="stylesheet" href="./proto.css">
</head>
<body>

<header class="switcher">
  <b>欧苏谱版式</b>
  <a href="./index.html">总览</a>
  <a href="./a.html">A · 上图下传</a>
  <a class="on" href="./b.html">B · 右图左传</a>
  <a href="./b2.html">B2 · 图传分页</a>
  <span>沈氏 · 世次四至六 · 19 人 · 对开</span>
</header>

<div class="sheet-fit">
  <div class="sheet wide">
    <div class="head">
      <b>沈氏宗谱</b>
      <i>卷之一　右图左传　世次四至六</i>
    </div>

    <div class="b-main">
      <div class="b-bio" id="bio"></div>
      <div class="b-spine">
        <b>沈氏宗谱</b>
        <i>岁次丙午孟冬　卷之一</i>
      </div>
      <div class="b-chart" id="chart"></div>
    </div>

    <div class="foot">
      <span>图仅本姓血脉，外衍不入图；一页所容世次少于上图下传，是右半幅图宽所限</span>
      <span>一</span>
    </div>
  </div>
</div>

<script src="./data.js"></script>
<script src="./proto.js"></script>
<script>
(function () {
  var C = window.PROTO_CTX, U = window.PROTO_UTIL
  var MAX_G = 6
  /* 谱序：先按房支、再按长幼，同房支连贯，不与其他房支交错 */
  var people = U.lineageOrder(
    C.members.filter(function (m) { return !m.isMarriedIn && m.generation <= MAX_G }),
    C.family.branches
  )
  var gens = []
  people.forEach(function (m) { if (gens.indexOf(m.generation) < 0) gens.push(m.generation) })
  gens.sort(function (a, b) { return a - b })

  /* —— 左传：竖排，一人一栏，栏首为名，名下续小传，组内右起 —— */
  var bio = document.getElementById('bio')
  gens.forEach(function (g) {
    var wrap = document.createElement('div')
    wrap.className = 'b-gen'
    var tag = document.createElement('div')
    tag.className = 'b-gtag'
    tag.textContent = U.genLabel(g)
    wrap.appendChild(tag)

    people.filter(function (m) { return m.generation === g }).forEach(function (m) {
      var col = document.createElement('div')
      col.className = 'b-col' + (C.blood.has(m.id) ? '' : ' ext')
      col.innerHTML = '<span class="n">' + m.name + '</span><span class="m">' + U.memoOf(m) + '</span>'
      wrap.appendChild(col)
    })
    bio.appendChild(wrap)
  })

  /* —— 右图：吊线图，一页一图 —— */
  document.getElementById('chart').innerHTML = U.svgChart(people, {
    font: 12, gapX: 6, padX: 5, gapY: 140, nodeH: 24, rowLabels: true, labelW: 30,
  })

  U.fitSheets()
})()
</script>
</body>
</html>
