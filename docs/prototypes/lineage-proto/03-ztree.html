<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图3 · ztree 树</title>
<style>
  :root{ --line:#9fb2c1; --blue:#4a90d9; --deep:#2a6fb5; --ink:#333; }
  *{box-sizing:border-box}
  body{
    margin:0; background:#fff; color:var(--ink);
    font:12px/1.4 "PingFang SC","Microsoft YaHei",sans-serif;
  }
  .topbar{
    display:flex; align-items:baseline; gap:14px;
    padding:14px 22px 10px; border-bottom:1px solid #eef1f4;
    font-size:14px;
  }
  .topbar b{font-size:15px; letter-spacing:.04em}
  .topbar span{font-size:12px; color:#7a8899}
  .topbar a{margin-left:auto; font-size:12px; color:#1a5fb4; text-decoration:none}
  .tree{padding:16px 22px 60px; min-width:max-content}
  .row{display:flex; align-items:center; height:22px}
  .guides{position:relative; flex:0 0 auto; align-self:stretch}
  .guides i{position:absolute; top:0; display:block; font-style:normal}
  .guides i.v{height:100%; border-left:1px solid var(--line)}
  .guides i.half{height:11px; border-left:1px solid var(--line)}
  .guides i.down{top:11px; height:11px; border-left:1px solid var(--line)}
  .guides i.elbow{top:11px; height:0; border-top:1px solid var(--line)}
  .caret{
    width:11px; height:11px; margin-right:3px; flex:0 0 auto; position:relative;
    border:1px solid var(--blue); border-radius:50%; background:#fff; cursor:pointer;
  }
  .caret:before, .caret:after{
    content:""; position:absolute; background:var(--blue);
  }
  .caret:before{left:2px; right:2px; top:4.5px; height:1px}
  .caret:after{top:2px; bottom:2px; left:4.5px; width:1px}
  .caret.open:after{display:none}
  .caret.leaf{border-color:#d5dde5; cursor:default}
  .caret.leaf:before,.caret.leaf:after{display:none}
  .ico{width:15px; height:15px; margin-right:4px; flex:0 0 auto}
  .nm{font-size:12px; letter-spacing:.02em; white-space:nowrap}
  .ph{color:#a9b4bf}
  .foot{margin:10px 22px 26px; font-size:11px; color:#8b97a4; line-height:1.7}
  @media (max-width:620px){
    .topbar{flex-wrap:wrap; gap:6px 10px; padding:12px 14px}
    .tree{padding:12px 14px 40px}
    .guide{width:15px}
    .guide i{left:6px}
    .guide i.elbow{left:6px; width:8px}
  }
</style>
</head>
<body>
  <div class="topbar">
    <b>清溪沈氏 · ztree</b>
    <span>版式三：逐级缩进树（参照图 3）</span>
    <a href="./index.html">← 返回五种版式</a>
  </div>
  <div class="tree" id="tree"></div>
  <p class="foot" id="note"></p>

<script src="./data.js"></script>
<script>
(function () {
  var U = window.LINEAGE_UTIL, L = window.LINEAGE;
  var tree = document.getElementById("tree");
  var collapsed = {};

  var ICON = '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true">' +
    '<circle cx="8" cy="8" r="7.2" fill="#4a90d9"/>' +
    '<circle cx="8" cy="5.9" r="2.5" fill="#fff"/>' +
    '<path d="M3.4 13.4c.5-2.5 2.3-3.8 4.6-3.8s4.1 1.3 4.6 3.8z" fill="#fff"/>' +
    '</svg>';

  var STEP = 18;

  function guides(depth, flags, isLast) {
    var wrap = document.createElement("span");
    wrap.className = "guides";
    wrap.style.width = depth * STEP + "px";
    for (var i = 0; i < depth - 1; i++) {
      if (!flags[i]) continue;
      var v = document.createElement("i");
      v.className = "v";
      v.style.left = i * STEP + STEP / 2 - 0.5 + "px";
      wrap.appendChild(v);
    }
    if (depth > 0) {
      var x = (depth - 1) * STEP + STEP / 2 - 0.5;
      var stem = document.createElement("i");
      stem.className = isLast ? "half" : "v";
      stem.style.left = x + "px";
      wrap.appendChild(stem);
      var arm = document.createElement("i");
      arm.className = "elbow";
      arm.style.left = x + "px";
      arm.style.width = STEP / 2 + "px";
      wrap.appendChild(arm);
    }
    return wrap;
  }

  function node(p, depth, flags, isLast) {
    var kids = U.children(p.id);
    var closed = !!collapsed[p.id];

    var row = document.createElement("div");
    row.className = "row";
    var guidesEl = guides(depth, flags, isLast);
    row.appendChild(guidesEl);

    if (kids.length) {
      var c = document.createElement("span");
      c.className = "caret" + (closed ? "" : " open");
      c.title = closed ? "展开" : "收起";
      c.onclick = function () { collapsed[p.id] = !collapsed[p.id]; draw(); };
      row.appendChild(c);
    } else {
      var leaf = document.createElement("span");
      leaf.className = "caret leaf";
      row.appendChild(leaf);
    }

    row.insertAdjacentHTML("beforeend", ICON);

    var nm = document.createElement("span");
    nm.className = "nm" + (p.ph ? " ph" : "");
    nm.textContent = p.n;
    row.appendChild(nm);

    tree.appendChild(row);

    if (kids.length && !closed) {
      var down = document.createElement("i");
      down.className = "down";
      down.style.left = depth * STEP + STEP / 2 - 0.5 + "px";
      guidesEl.appendChild(down);

      kids.forEach(function (k, i) {
        node(k, depth + 1, flags.concat([!isLast]), i === kids.length - 1);
      });
    }
  }

  function draw() {
    tree.innerHTML = "";
    var roots = U.roots();
    roots.forEach(function (r, i) { node(r, 0, [], i === roots.length - 1); });
    document.getElementById("note").textContent = L.note + "。浅灰姓名为占位族人。";
  }

  draw();
})();
</script>
</body>
</html>
