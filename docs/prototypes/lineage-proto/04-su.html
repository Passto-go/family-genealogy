<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图4 · 苏式吊线图</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; background:#f4f1ea; color:#1c1c1c;
    font-family:"Songti SC","SimSun","Noto Serif CJK SC",serif;
  }
  .topbar{
    display:flex; align-items:baseline; gap:14px;
    padding:14px 22px 10px; border-bottom:1px solid #e2ddd2;
    font-family:-apple-system,"PingFang SC",sans-serif; font-size:14px;
  }
  .topbar b{font-size:15px; letter-spacing:.04em}
  .topbar span{font-size:12px; color:#7a746a}
  .topbar a{margin-left:auto; font-size:12px; color:#1a5fb4; text-decoration:none}

  .page{padding:26px 22px 60px; display:flex; justify-content:center}
  .frame{
    position:relative; width:100%; max-width:1240px; background:#fff;
    border:1px solid #1c1c1c; outline:3px solid #1c1c1c; outline-offset:4px;
    display:flex; align-items:stretch;
  }
  .spine{
    flex:0 0 64px; border-right:1px solid #1c1c1c;
    writing-mode:vertical-rl; text-orientation:upright;
    display:flex; align-items:center; justify-content:center;
    letter-spacing:.42em; font-size:15px; line-height:1.1;
    padding:18px 0; user-select:none;
  }
  .spine.right{border-right:0; border-left:1px solid #1c1c1c; font-size:12.5px; letter-spacing:.28em; color:#3a3a3a}
  .spine b{font-weight:600; font-size:20px; letter-spacing:.5em}
  .chart{flex:1 1 auto; min-width:0; padding:8px 10px}
  .chart svg{display:block; width:100%; height:auto}
  .foot{
    max-width:1240px; margin:0 auto; padding:0 22px 30px;
    font-family:-apple-system,"PingFang SC",sans-serif; font-size:11.5px; color:#8b8478; line-height:1.7;
  }
  @media (max-width:720px){
    .topbar{flex-wrap:wrap; gap:6px 12px; padding:12px 14px}
    .page{padding:14px 10px 40px}
    .spine{flex-basis:34px; font-size:11px; letter-spacing:.2em; padding:8px 0}
    .spine b{font-size:13px; letter-spacing:.3em}
    .spine.right{font-size:9px}
    .chart{padding:4px}
  }
</style>
</head>
<body>
  <div class="topbar">
    <b>清溪沈氏 · 苏式吊线</b>
    <span>版式四：世代横排、父子吊线（参照图 4）</span>
    <a href="./index.html">← 返回五种版式</a>
  </div>

  <div class="page">
    <div class="frame">
      <div class="spine left"><b>清溪沈氏宗谱</b></div>
      <div class="chart" id="chart"></div>
      <div class="spine right"><span>公元二〇二六年　岁次丙午</span></div>
    </div>
  </div>
  <p class="foot" id="note"></p>

<script src="./data.js"></script>
<script>
(function () {
  var U = window.LINEAGE_UTIL, L = window.LINEAGE;
  var NODE_W = 86, GAP = 12, ROW_H = 92, TOP = 46, PAD_X = 46, PAD_Y = 34;
  var CN = ["一","二","三","四","五","六","七","八","九","十"];
  var NS = "http://www.w3.org/2000/svg";

  var people = L.people.slice();
  var kidsMap = {};
  people.forEach(function (p) {
    if (p.f === null) return;
    (kidsMap[p.f] = kidsMap[p.f] || []).push(p);
  });
  var roots = people.filter(function (p) { return p.f === null; });

  function measure(p) {
    var kids = kidsMap[p.id] || [];
    if (!kids.length) { p._w = NODE_W; return p._w; }
    var w = 0;
    kids.forEach(function (k) { w += measure(k); });
    w += GAP * (kids.length - 1);
    p._w = Math.max(NODE_W, w);
    return p._w;
  }

  function place(p, x) {
    var kids = kidsMap[p.id] || [];
    var cx = x;
    kids.forEach(function (k) {
      place(k, cx);
      cx += k._w + GAP;
    });
    if (kids.length) {
      p._x = (kids[0]._x + kids[kids.length - 1]._x) / 2;
    } else {
      p._x = x + p._w / 2;
    }
    p._y = TOP + (p.g - 1) * ROW_H;
  }

  function el(name, attrs, text) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  }

  var totalW = 0, maxG = 0;
  roots.forEach(function (r) { totalW += measure(r) + GAP * 2; });
  roots.forEach(function (r, i) { place(r, PAD_X + i * 0); });
  people.forEach(function (p) { if (p.g > maxG) maxG = p.g; });

  // 重新按根依次偏移
  var cursor = PAD_X;
  function placeRoots() {
    cursor = PAD_X;
    roots.forEach(function (r) {
      place(r, cursor);
      cursor += r._w + GAP * 2;
    });
  }
  placeRoots();
  var treeW = cursor - PAD_X - GAP * 2;

  var W = Math.ceil(treeW + PAD_X * 2);
  var H = TOP + maxG * ROW_H + PAD_Y;

  var svg = el("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "苏式吊线世系图" });

  // 世代行标签
  for (var g = 1; g <= maxG; g++) {
    var y = TOP + (g - 1) * ROW_H;
    svg.appendChild(el("text", {
      x: 12, y: y + 4, "font-size": 11, fill: "#8a8478", "letter-spacing": "1"
    }, (CN[g - 1] || g) + "世"));
  }

  // 吊线
  people.forEach(function (p) {
    var kids = kidsMap[p.id] || [];
    if (!kids.length) return;
    var midY = p._y + ROW_H / 2 - 8;
    svg.appendChild(el("line", {
      x1: p._x, y1: p._y + 8, x2: p._x, y2: midY,
      stroke: "#8f8a80", "stroke-width": 1
    }));
    svg.appendChild(el("line", {
      x1: kids[0]._x, y1: midY, x2: kids[kids.length - 1]._x, y2: midY,
      stroke: "#8f8a80", "stroke-width": 1
    }));
    kids.forEach(function (k) {
      svg.appendChild(el("line", {
        x1: k._x, y1: midY, x2: k._x, y2: k._y - 6,
        stroke: "#8f8a80", "stroke-width": 1
      }));
    });
  });

  // 节点
  people.forEach(function (p) {
    svg.appendChild(el("circle", {
      cx: p._x - 30, cy: p._y, r: 2.4, fill: p.ph ? "#b9b3a8" : "#b3261e"
    }));
    svg.appendChild(el("text", {
      x: p._x - 22, y: p._y + 4.5, "font-size": 13.5, fill: p.ph ? "#a8a29a" : "#1c1c1c",
      "letter-spacing": "0.5"
    }, p.n));
    var kids = kidsMap[p.id] || [];
    if (kids.length) {
      svg.appendChild(el("text", {
        x: p._x - 22, y: p._y - 12, "font-size": 9, fill: "#9a948a"
      }, "子" + (CN[kids.length - 1] || kids.length)));
    }
  });

  document.getElementById("chart").appendChild(svg);
  document.getElementById("note").textContent =
    L.note + "。红点为本支族人，灰点为占位；节点上方小字为该人子女数。";
})();
</script>
</body>
</html>
